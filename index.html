<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹿蜀海洋大冒险 · 抓鱼大作战</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
  :root {
    --accent: #ffb400;
    --cyan: #00d4ff;
    --red: #ff4d4d;
    --ink: #0a2a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a2a3a; touch-action: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }

  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-score { color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .hud-score .label { font-size: 12px; letter-spacing: 2px; opacity: .85; }
  .hud-score .num { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .hud-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hearts { font-size: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.4); letter-spacing: 2px; }
  .heart { display: inline-block; transition: transform .15s; }
  .heart.lost { filter: grayscale(1) brightness(.5); transform: scale(.85); }
  .fish-count { background: rgba(10,42,58,.55); backdrop-filter: blur(4px); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
  .fish-count .fish-emoji { font-size: 16px; }

  /* combo */
  #combo { position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 44px; font-weight: 900; color: var(--accent); text-shadow: 0 3px 12px rgba(0,0,0,.5), 0 0 24px rgba(255,180,0,.6); transition: transform .18s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  #combo.show { transform: translate(-50%, -50%) scale(1); }

  /* last catch toast */
  #toast { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; color: #fff; font-size: 16px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.5); background: rgba(10,42,58,.6); padding: 8px 16px; border-radius: 22px; transition: all .25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* vignette flash */
  #flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,255,255,.55) 100%); opacity: 0; transition: opacity .12s; }
  #flash.hit { background: radial-gradient(ellipse at center, transparent 40%, rgba(255,60,60,.6) 100%); }

  /* 道具状态条 */
  #powerupBar { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); letter-spacing: 2px; min-height: 22px; white-space: nowrap; }

  /* 里程碑提示 */
  #milestone { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 42px; font-weight: 900; color: #7dd7ff; text-shadow: 0 3px 14px rgba(0,0,0,.55), 0 0 26px rgba(80,200,255,.5); transition: transform .2s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  #milestone.show { transform: translate(-50%, -50%) scale(1); }

  /* overlays */
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at 50% 30%, rgba(0,120,180,.75), rgba(6,32,48,.95)); color: #fff; padding: 24px; }
  .overlay.hidden { display: none; }
  .title { font-size: clamp(34px, 8vw, 64px); font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg,#fff,#ffd54d); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .subtitle { margin-top: 8px; font-size: 18px; color: #bfeaff; letter-spacing: 4px; }
  .controls-hint { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 460px; }
  .key { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
  .key b { color: #ffd54d; font-size: 16px; }
  .btn { margin-top: 28px; pointer-events: auto; cursor: pointer; font-size: 22px; font-weight: 800; color: #0a2a3a; background: linear-gradient(180deg,#ffd54d,#ffb400); border: none; border-radius: 40px; padding: 16px 56px; letter-spacing: 4px; box-shadow: 0 8px 24px rgba(255,180,0,.45); transition: transform .12s; }
  .btn:active { transform: scale(.95); }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; border: 1px solid rgba(255,255,255,.3); }

  .final-score { font-size: 52px; font-weight: 900; margin-top: 10px; color: #ffd54d; }
  .final-stats { margin-top: 14px; display: flex; gap: 26px; font-size: 16px; color: #cfeaff; }
  .final-stats b { font-size: 22px; color: #fff; }
  .best { margin-top: 8px; font-size: 14px; color: #9fd4ff; }
  .credit { margin-top: 22px; font-size: 11px; color: rgba(255,255,255,.5); letter-spacing: 1px; max-width: 90%; line-height: 1.6; }

  .loading { position: fixed; inset: 0; z-index: 30; background: #0a2a3a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .loading .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: #ffd54d; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 18px; }
  .loading .p { font-size: 15px; letter-spacing: 2px; color: #bfeaff; }
  .loading .bar { width: 220px; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#00d4ff,#ffd54d); border-radius: 3px; transition: width .2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-score">
        <div class="label">距离</div>
        <div class="num" id="score">0</div>
      </div>
      <div class="hud-right">
        <div class="hearts" id="hearts"></div>
        <div class="fish-count"><span class="fish-emoji">🐟</span><span id="fishCount">0</span> 条</div>
      </div>
    </div>
    <div id="combo"></div>
    <div id="milestone"></div>
    <div id="powerupBar"></div>
    <div id="toast"></div>
    <div id="flash"></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="title">鹿蜀海洋大冒险</div>
    <div class="subtitle">🐟 抓鱼大作战 🐟</div>
    <div class="controls-hint">
      <div class="key"><b>← →</b> / <b>A D</b><br>切换泳道</div>
      <div class="key"><b>↑</b> / <b>空格</b><br>跳跃</div>
      <div class="key"><b>↓</b> / <b>S</b><br>下潜</div>
      <div class="key">📱 手机<br>滑动操作</div>
    </div>
    <div class="controls-hint">
      <div class="key">🐟 金光环=可抓<br>🔴 红光环=危险</div>
      <div class="key">🛡️护盾 · 🧲磁铁<br>✨双倍分 · ⚡加速</div>
    </div>
    <button class="btn" id="startBtn">开始抓鱼</button>
    <div class="credit">角色：儿子骑鹿蜀（原色） · 鱼：Quaternius (CC0) · 章鱼 by Google (CC-BY 3.0)</div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="title" style="font-size: clamp(30px,6vw,48px)">被海水冲走啦！</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-stats">
      <div>🐟 抓到 <b id="finalFish">0</b> 条</div>
      <div>🏆 最高连击 <b id="finalCombo">0</b></div>
    </div>
    <div class="best" id="bestScore"></div>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="p">正在召唤鹿蜀下海…</div>
    <div class="bar"><i id="loadBar"></i></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
